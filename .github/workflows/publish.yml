name: Publish image

# Publishes a CI-tagged version (v1, v2, ...) to the GitHub Container Registry
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, such as v12 (empty for the newest)
        required: false
        default: ''
      latest:
        description: Also tag the image as latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
            if ! echo "$version" | grep -qx 'v[0-9][0-9]*'; then
              echo "::error::'$version' is not a version tag (v1, v2, ...)"
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
              echo "::error::Tag $version does not exist"
              exit 1
            fi
          else
            version=$(git tag --list 'v[0-9]*' | grep -x 'v[0-9][0-9]*' | sort -V | tail -1)
            if [ -z "$version" ]; then
              echo "::error::No version tags yet; CI tags successful builds on main"
              exit 1
            fi
          fi
          git checkout -q "refs/tags/$version"
          # Registry image names must be lowercase
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:$VERSION"
            if [ "$LATEST" = true ]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=key-sticker-sheets-app
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Published **$VERSION**:" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
